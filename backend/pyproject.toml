[project]
name = "ai-doc-platform-backend"
version = "0.1.0"
description = "Standalone FastAPI backend for AI-Assisted Document Authoring and Generation Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "live_ai: marks tests that invoke the live Gemini API (requires GEMINI_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
